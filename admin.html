<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e4d78">
<title>Painel Admin — 15 Anos da Maria</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body-page">

<div class="admin-container">

    <!-- ==================== LOGIN ==================== -->
    <div class="admin-login-screen" id="loginScreen">
        <div class="login-card">
            <div class="login-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h1>Painel de Confirmações</h1>
            <p>15 Anos da Maria</p>
            <input type="password" id="adminPassword" placeholder="••••••••" autocomplete="current-password">
            <button class="btn-login" id="btnLogin">Entrar</button>
            <div class="form-message" id="loginMessage"></div>
            <a href="index.html" class="back-link">← Voltar ao convite</a>
        </div>
    </div>

    <!-- ==================== DASHBOARD ==================== -->
    <div class="admin-dashboard" id="dashboard" style="display:none;">

        <header class="dashboard-topbar">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2l3 6 6 1-4 5 1 6-6-3-6 3 1-6-4-5 6-1z"/></svg>
                </div>
                <div class="brand-text">
                    <h1>Painel de Confirmações</h1>
                    <span>15 Anos da Maria</span>
                </div>
            </div>
            <div class="topbar-actions">
                <button class="btn-action" id="btnRefresh">
                    <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                    Atualizar
                </button>
                <a href="index.html" class="btn-action">
                    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Convite
                </a>
                <button class="btn-action danger" id="btnLogout">
                    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    Sair
                </button>
            </div>
        </header>

        <div class="dashboard-content">

            <!-- STATS -->
            <section class="stats-section">
                <div class="stats-grid" id="statsGrid"></div>
            </section>

            <!-- FILTROS -->
            <section class="filters-section">
                <div class="search-box">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                    <input type="text" id="filterSearch" placeholder="Buscar por nome ou telefone...">
                </div>
                <select id="filterStatus" class="filter-select">
                    <option value="">Todos os status</option>
                    <option value="confirmado">Confirmados</option>
                    <option value="pendente">Pendentes</option>
                    <option value="recusado">Recusados</option>
                </select>
                <button class="btn-export" id="btnExportCSV">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                    Exportar CSV
                </button>
            </section>

            <!-- TABELA -->
            <section class="table-section">
                <div class="table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>WhatsApp</th>
                                <th>Acomp.</th>
                                <th>Mensagem</th>
                                <th>Data</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody"></tbody>
                    </table>
                </div>
                <div id="emptyState" class="empty-state" style="display:none;">
                    <svg viewBox="0 0 24 24"><path d="M9 12h6M9 16h6M9 8h6M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg>
                    <p>Nenhuma confirmação encontrada</p>
                </div>
            </section>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
